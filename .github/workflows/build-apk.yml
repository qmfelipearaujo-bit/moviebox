name: Gerar APK Android - Media Box

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Compilar interface
        run: npm run build

      - name: Criar projeto Android
        run: npx cap add android

      - name: Instalar recursos nativos do Media Box
        run: node scripts-install-native-android.mjs

      - name: Verificar bridge nativa do Media Box
        run: |
          test -f android/app/src/main/java/com/moviebox/personal/MovieNativePlugin.java
          test -f android/app/src/main/java/com/moviebox/personal/MainActivity.java
          grep -q 'registerPlugin(MovieNativePlugin.class)' android/app/src/main/java/com/moviebox/personal/MainActivity.java
          grep -q '@CapacitorPlugin(name = "MovieNative")' android/app/src/main/java/com/moviebox/personal/MovieNativePlugin.java
          echo 'Bridge nativa MovieNative confirmada no projeto Android.'

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Gerar APK Debug
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Media-Box-debug.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Media-Box-APK
          path: Media-Box-debug.apk
          if-no-files-found: error
          retention-days: 30
