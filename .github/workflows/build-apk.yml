name: Gerar APK Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Compilar aplicativo
        run: npm run build

      - name: Criar Android
        run: npx cap add android

      - name: Sincronizar Android
        run: npx cap sync android

      - name: Gerar APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Copiar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MovieBox-Private-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MovieBox-Private-APK
          path: MovieBox-Private-debug.apk
          retention-days: 30
